<script>
const ALL = JSON.parse(document.getElementById('p-all').textContent);
const vd = document.getElementById('vd'), vt = document.getElementById('vt');
document.querySelectorAll('#sub-sw .hud-btn').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('#sub-sw .hud-btn').forEach(x => x.classList.remove('primary'));
    b.classList.add('primary');
    const p = ALL[b.dataset.id];
    document.getElementById('s-spec').textContent = p.res_spec;
    document.getElementById('s-dur').textContent = p.frames + ' 帧 · ' + p.duration_s + 's';
    document.getElementById('s-cov').textContent = p.valid_transitions + ' / ' + (p.frames-1) + ' (' + p.coverage_pct + '%)';
    document.getElementById('s-path').textContent = p.path_m + ' m';
    document.getElementById('s-p95').textContent = p.p95_step_cm + ' cm';
    vd.src = p.depth_mp4_rel; vt.src = p.traj_mp4_rel;
  };
});
document.getElementById('syncplay').onclick = async () => {
  vt.currentTime = vd.currentTime;
  vd.muted = true; vt.muted = true;
  await Promise.all([vd.play(), vt.play()]);
};
document.getElementById('syncpause').onclick = () => { vd.pause(); vt.pause(); };
vd.addEventListener('seeking', () => { vt.currentTime = vd.currentTime; });
vd.addEventListener('timeupdate', () => {
  document.getElementById('synctime').textContent = vd.currentTime.toFixed(2) + ' s';
  if (!vd.paused && Math.abs(vd.currentTime - vt.currentTime) > 0.12) vt.currentTime = vd.currentTime;
});
</script>
